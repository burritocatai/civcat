name: Security Scanning

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Full image reference to scan (e.g. ghcr.io/org/repo:1.2.3). Leave blank to auto-resolve from the latest semver tag."
        required: false
        type: string
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 03:00 UTC
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: read
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────
  # 1. Resolve the image reference to scan
  # ─────────────────────────────────────────────
  resolve-image:
    name: Resolve Image Reference
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.resolve.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image reference
        id: resolve
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          if [[ -n "${{ inputs.image_ref }}" ]]; then
            IMAGE="${{ inputs.image_ref }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            IMAGE="${BASE}:${TAG}"
          else
            LATEST_TAG=$(git tag --list 'v*' | sort -V | tail -n1)
            if [[ -z "${LATEST_TAG}" ]]; then
              echo "::error::No semver tags found. Push a 'v*' tag first or supply an explicit image_ref."
              exit 1
            fi
            TAG="${LATEST_TAG#v}"
            IMAGE="${BASE}:${TAG}"
            echo "Resolved latest semver tag: ${LATEST_TAG} → ${TAG}"
          fi

          echo "image_ref=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Will scan: ${IMAGE}"

      - name: Wait for image to be available
        if: github.event_name == 'push'
        run: |
          IMAGE="${{ steps.resolve.outputs.image_ref }}"
          echo "Waiting for ${IMAGE}…"
          for i in $(seq 1 20); do
            if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
              echo "Image available after attempt ${i}."
              exit 0
            fi
            echo "Attempt ${i}/20 — retrying in 30 s…"
            sleep 30
          done
          echo "::error::Image ${IMAGE} not available after 10 minutes."
          exit 1

  # ─────────────────────────────────────────────
  # 2. Dockerfile linting — Hadolint
  # ─────────────────────────────────────────────
  hadolint:
    name: Hadolint (Dockerfile Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif
          no-fail: true

      - name: Upload Hadolint SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  # ─────────────────────────────────────────────
  # 3. Go source security
  # ─────────────────────────────────────────────
  go-security:
    name: Go Security Scanners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false   # avoids the cache service 400 error

      # govulncheck — official Go vuln DB
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...

      # gosec — static analysis
      # IMPORTANT: gosec's SARIF output has an upstream bug where it emits a
      # non-standard 'relationships' field that fails GitHub's SARIF schema
      # validator. There is no flag to suppress it. We therefore use the 'text'
      # format for human-readable output in the job log and fail explicitly on
      # findings, rather than trying to upload broken SARIF to the Security tab.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: |
          gosec -fmt text -stdout ./...

      # nancy — dependency CVEs via Sonatype OSS Index
      - name: Install nancy
        run: |
          curl -sSfL \
            https://github.com/sonatype-nexus-community/nancy/releases/latest/download/nancy-linux.amd64-musl \
            -o /usr/local/bin/nancy
          chmod +x /usr/local/bin/nancy

      - name: Run nancy
        run: go list -json -deps ./... | nancy sleuth

  # ─────────────────────────────────────────────
  # 4. Container image scan — Grype (CLI)
  # ─────────────────────────────────────────────
  grype:
    name: Grype (Container Image)
    runs-on: ubuntu-latest
    needs: resolve-image
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      # IMPORTANT: do NOT use --fail-on. It causes Grype to exit before the OS
      # flushes the SARIF file buffer, producing a truncated JSON file that
      # fails the upload step. Instead we check the output for findings and
      # fail the job ourselves after the upload has completed.
      - name: Run Grype
        run: |
          grype "${{ needs.resolve-image.outputs.image_ref }}" \
            --output sarif \
            --file grype.sarif
          echo "grype_exit=$?" >> "$GITHUB_ENV"

      - name: Verify SARIF was written
        run: |
          if [[ ! -f grype.sarif ]]; then
            echo "::error::grype.sarif was not created"
            exit 1
          fi
          echo "grype.sarif size: $(wc -c < grype.sarif) bytes"
          # Validate it is parseable JSON
          python3 -c "import json,sys; json.load(open('grype.sarif'))" \
            || { echo "::error::grype.sarif is not valid JSON"; exit 1; }

      - name: Upload Grype SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: grype.sarif
          category: grype

      # Fail the job if Grype found any HIGH or CRITICAL vulnerabilities.
      # We do this after the upload so findings always appear in the Security tab.
      - name: Fail on HIGH/CRITICAL findings
        run: |
          HIGH=$(python3 - <<'EOF'
          import json, sys
          sarif = json.load(open("grype.sarif"))
          severities = []
          for run in sarif.get("runs", []):
              for result in run.get("results", []):
                  level = result.get("level", "")
                  props = result.get("properties", {})
                  severity = props.get("security-severity", "0")
                  severities.append(float(severity))
          high_or_critical = [s for s in severities if s >= 7.0]
          print(len(high_or_critical))
          EOF
          )
          if [[ "$HIGH" -gt 0 ]]; then
            echo "::error::Grype found ${HIGH} HIGH or CRITICAL vulnerabilities. Review the Security tab."
            exit 1
          fi
          echo "No HIGH or CRITICAL vulnerabilities found."

  # ─────────────────────────────────────────────
  # 5. Container image + filesystem scan — Trivy (CLI)
  #
  # IMPORTANT: we use the official install script rather than the apt repo or
  # the trivy-action Docker wrapper. The Docker wrapper writes output files
  # inside the container's own filesystem — not the runner's GITHUB_WORKSPACE —
  # making them invisible to the upload steps regardless of what path you pass.
  # ─────────────────────────────────────────────
  trivy:
    name: Trivy (Image + Filesystem)
    runs-on: ubuntu-latest
    needs: resolve-image
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Trivy — image scan
        run: |
          trivy image \
            --format sarif \
            --output trivy-image.sarif \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            "${{ needs.resolve-image.outputs.image_ref }}"

      - name: Verify image SARIF
        run: |
          ls -la trivy-image.sarif
          python3 -c "import json; json.load(open('trivy-image.sarif'))" \
            || { echo "::error::trivy-image.sarif is not valid JSON"; exit 1; }

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Trivy — filesystem scan (misconfigs + secrets)
        run: |
          trivy fs \
            --format sarif \
            --output trivy-fs.sarif \
            --scanners misconfig,secret,vuln \
            --exit-code 0 \
            .

      - name: Verify filesystem SARIF
        run: |
          ls -la trivy-fs.sarif
          python3 -c "import json; json.load(open('trivy-fs.sarif'))" \
            || { echo "::error::trivy-fs.sarif is not valid JSON"; exit 1; }

      - name: Upload Trivy filesystem SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ─────────────────────────────────────────────
  # 6. Aggregate gate
  # ─────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [hadolint, go-security, grype, trivy]
    if: always()
    steps:
      - name: Check job results
        run: |
          FAILED=()
          [[ "${{ needs.hadolint.result }}"    == "failure" ]] && FAILED+=("hadolint")
          [[ "${{ needs.go-security.result }}" == "failure" ]] && FAILED+=("go-security")
          [[ "${{ needs.grype.result }}"       == "failure" ]] && FAILED+=("grype")
          [[ "${{ needs.trivy.result }}"       == "failure" ]] && FAILED+=("trivy")

          if [[ ${#FAILED[@]} -gt 0 ]]; then
            echo "::error::Security jobs failed: ${FAILED[*]}"
            echo "Review findings in the Security tab → Code scanning alerts."
            exit 1
          fi

          echo "All security scans passed ✓"
