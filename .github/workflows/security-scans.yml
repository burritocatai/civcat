name: Security Scanning

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Full image reference to scan (e.g. ghcr.io/org/repo:1.2.3). Leave blank to auto-resolve from the latest semver tag."
        required: false
        type: string
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 03:00 UTC
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: read
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────
  # 1. Resolve the image reference to scan
  # ─────────────────────────────────────────────
  resolve-image:
    name: Resolve Image Reference
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.resolve.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image reference
        id: resolve
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          if [[ -n "${{ inputs.image_ref }}" ]]; then
            IMAGE="${{ inputs.image_ref }}"

          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            IMAGE="${BASE}:${TAG}"

          else
            LATEST_TAG=$(git tag --list 'v*' | sort -V | tail -n1)
            if [[ -z "${LATEST_TAG}" ]]; then
              echo "::error::No semver tags found. Push a 'v*' tag first or supply an explicit image_ref."
              exit 1
            fi
            TAG="${LATEST_TAG#v}"
            IMAGE="${BASE}:${TAG}"
            echo "Resolved latest semver tag: ${LATEST_TAG} → ${TAG}"
          fi

          echo "image_ref=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Will scan: ${IMAGE}"

      - name: Wait for image to be available
        if: github.event_name == 'push'
        run: |
          IMAGE="${{ steps.resolve.outputs.image_ref }}"
          echo "Waiting for ${IMAGE}…"
          for i in $(seq 1 20); do
            if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
              echo "Image available after attempt ${i}."
              exit 0
            fi
            echo "Attempt ${i}/20 — retrying in 30 s…"
            sleep 30
          done
          echo "::error::Image ${IMAGE} not available after 10 minutes."
          exit 1

  # ─────────────────────────────────────────────
  # 2. Dockerfile linting — Hadolint
  # ─────────────────────────────────────────────
  hadolint:
    name: Hadolint (Dockerfile Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif
          no-fail: true

      - name: Upload Hadolint SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  # ─────────────────────────────────────────────
  # 3. Go source security
  # ─────────────────────────────────────────────
  go-security:
    name: Go Security Scanners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-go: only specify go-version-file here — govulncheck-action
      # manages its own Go installation so we don't pass go-version-file to it.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # govulncheck — official Go vuln DB
      # Let the action handle its own Go setup to avoid the duplicate-input warning.
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...

      # gosec — static analysis
      # Do NOT pass -verbose=text — it injects a non-standard 'relationships'
      # field that fails GitHub's SARIF schema validator.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: |
          gosec -fmt sarif -out gosec.sarif ./...
          exit 0  # always succeed so the upload step runs even when issues are found

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec.sarif
          category: gosec

      # nancy — dependency CVEs via Sonatype OSS Index
      - name: Install nancy
        run: |
          curl -sSfL \
            https://github.com/sonatype-nexus-community/nancy/releases/latest/download/nancy-linux.amd64-musl \
            -o /usr/local/bin/nancy
          chmod +x /usr/local/bin/nancy

      - name: Run nancy
        run: go list -json -deps ./... | nancy sleuth

  # ─────────────────────────────────────────────
  # 4. Container image scan — Grype (CLI)
  #
  # We call the Grype CLI directly instead of using anchore/scan-action because
  # the action exits non-zero on HIGH findings before finishing the SARIF write,
  # producing a truncated file that fails the upload with a JSON syntax error.
  # ─────────────────────────────────────────────
  grype:
    name: Grype (Container Image)
    runs-on: ubuntu-latest
    needs: resolve-image
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Grype
        id: grype
        run: |
          grype "${{ needs.resolve-image.outputs.image_ref }}" \
            --output sarif \
            --file grype.sarif \
            --fail-on high \
            || echo "grype_failed=true" >> "$GITHUB_OUTPUT"

      - name: Upload Grype SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: grype.sarif
          category: grype

      - name: Fail on HIGH/CRITICAL findings
        if: steps.grype.outputs.grype_failed == 'true'
        run: |
          echo "::error::Grype found HIGH or CRITICAL vulnerabilities. Review the Security tab."
          exit 1

  # ─────────────────────────────────────────────
  # 5. Container image scan — Trivy (CLI)
  #
  # We call the Trivy CLI directly instead of using aquasecurity/trivy-action
  # because the action runs inside a container with its own working directory,
  # causing output files to be written to a path that the host runner cannot
  # find during the upload step — even when using ${{ github.workspace }}.
  # ─────────────────────────────────────────────
  trivy:
    name: Trivy (Image + Filesystem)
    runs-on: ubuntu-latest
    needs: resolve-image
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install -y trivy

      - name: Trivy — image scan
        run: |
          trivy image \
            --format sarif \
            --output trivy-image.sarif \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            "${{ needs.resolve-image.outputs.image_ref }}"

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Trivy — filesystem scan (misconfigs + secrets)
        run: |
          trivy fs \
            --format sarif \
            --output trivy-fs.sarif \
            --scanners misconfig,secret,vuln \
            --exit-code 0 \
            .

      - name: Upload Trivy filesystem SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ─────────────────────────────────────────────
  # 6. Aggregate gate
  # ─────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [hadolint, go-security, grype, trivy]
    if: always()
    steps:
      - name: Check job results
        run: |
          FAILED=()
          [[ "${{ needs.hadolint.result }}"    == "failure" ]] && FAILED+=("hadolint")
          [[ "${{ needs.go-security.result }}" == "failure" ]] && FAILED+=("go-security")
          [[ "${{ needs.grype.result }}"       == "failure" ]] && FAILED+=("grype")
          [[ "${{ needs.trivy.result }}"       == "failure" ]] && FAILED+=("trivy")

          if [[ ${#FAILED[@]} -gt 0 ]]; then
            echo "::error::Security jobs failed: ${FAILED[*]}"
            echo "Review findings in the Security tab → Code scanning alerts."
            exit 1
          fi

          echo "All security scans passed ✓"
