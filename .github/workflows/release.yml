name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths-ignore:
      - ".github/**"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      tag_created: ${{ steps.create.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest
        run: |
          tag=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          echo "tag=${tag:-v0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Determine next version
        id: tag
        run: |
          current="${{ steps.latest.outputs.tag }}"
          # Strip leading v
          version="${current#v}"
          IFS='.' read -r major minor patch <<< "$version"

          # Check commit messages since last tag for version bump signals
          if [ "$current" = "v0.0.0" ]; then
            range="HEAD"
          else
            range="${current}..HEAD"
          fi

          commits=$(git log "$range" --pretty=format:"%s" 2>/dev/null || echo "")

          if echo "$commits" | grep -qiE "^(BREAKING|feat!|fix!):"; then
            major=$((major + 1))
            minor=0
            patch=0
          elif echo "$commits" | grep -qiE "^feat(\(.+\))?:"; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          new_tag="v${major}.${minor}.${patch}"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "${{ steps.tag.outputs.new_tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        id: create
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag "${{ steps.tag.outputs.new_tag }}"
          git push origin "${{ steps.tag.outputs.new_tag }}"
          echo "created=true" >> "$GITHUB_OUTPUT"

  build-binaries:
    runs-on: ubuntu-latest
    needs: tag
    if: needs.tag.outputs.tag_created == 'true'
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          output="civcat-${GOOS}-${GOARCH}${ext}"
          go build -ldflags="-s -w -X main.version=${{ needs.tag.outputs.new_tag }}" -o "$output" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: civcat-${{ matrix.goos }}-${{ matrix.goarch }}
          path: civcat-*

  docker:
    runs-on: ubuntu-latest
    needs: tag
    if: needs.tag.outputs.tag_created == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.tag.outputs.new_tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: [tag, build-binaries, docker]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: civcat-*
          path: artifacts
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          prev_tag=$(git tag -l 'v*' --sort=-v:refname | sed -n '2p')
          if [ -n "$prev_tag" ]; then
            range="${prev_tag}..HEAD"
          else
            range="HEAD"
          fi
          log=$(git log "$range" --pretty=format:"- %s (%h)" 2>/dev/null || echo "- Initial release")
          {
            echo "changelog<<EOF"
            echo "$log"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}

            ## Docker
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ needs.tag.outputs.new_tag }}
            ```
          files: artifacts/*
          generate_release_notes: false
